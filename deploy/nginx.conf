# piwebui — nginx 站点配置
#
# 用法：
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/piwebui
#   sudo ln -s /etc/nginx/sites-available/piwebui /etc/nginx/sites-enabled/
#   修改 server_name 后：
#   sudo nginx -t && sudo systemctl reload nginx
#
# 证书：sudo certbot --nginx -d pi.example.com

# 登录接口限速，防止令牌爆破
limit_req_zone $binary_remote_addr zone=piwebui_login:10m rate=10r/m;

upstream piwebui_relay {
	server 127.0.0.1:8787;
	keepalive 16;
}

server {
	listen 80;
	listen [::]:80;
	server_name pi.example.com;

	location /.well-known/acme-challenge/ {
		root /var/www/certbot;
	}

	location / {
		return 301 https://$host$request_uri;
	}
}

server {
	listen 443 ssl;
	listen [::]:443 ssl;
	http2 on;
	server_name pi.example.com;

	ssl_certificate /etc/letsencrypt/live/pi.example.com/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/pi.example.com/privkey.pem;
	ssl_protocols TLSv1.2 TLSv1.3;
	ssl_prefer_server_ciphers off;
	ssl_session_cache shared:piwebui_ssl:10m;
	ssl_session_timeout 1d;

	# 语音上传：留出比 MAX_UPLOAD_MB 稍大的余量
	client_max_body_size 32m;
	client_body_timeout 120s;

	# 只在 TLS 终止后转发 https 标记；同时把真实 IP 透传给 Node
	proxy_set_header Host $host;
	proxy_set_header X-Real-IP $remote_addr;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header X-Forwarded-Proto $scheme;
	proxy_http_version 1.1;
	proxy_set_header Connection "";

	add_header X-Content-Type-Options nosniff always;
	add_header Referrer-Policy no-referrer always;

	# ── 浏览器实时通道 ────────────────────────────────────────────────
	location /ws {
		proxy_pass http://piwebui_relay;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_buffering off;
		proxy_read_timeout 3600s;
		proxy_send_timeout 3600s;
	}

	# ── 本地 agent 的反向连接 ─────────────────────────────────────────
	# 认证发生在 WebSocket 首帧（AGENT_SECRET），不依赖来源 IP。
	location /agent {
		proxy_pass http://piwebui_relay;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_buffering off;
		# agent 可能长时间静默（空闲时靠心跳保活），别让它被掐断
		proxy_read_timeout 7d;
		proxy_send_timeout 7d;
	}

	location = /api/login {
		limit_req zone=piwebui_login burst=5 nodelay;
		proxy_pass http://piwebui_relay;
	}

	location / {
		proxy_pass http://piwebui_relay;
		proxy_read_timeout 120s;
	}

	# 可选：把带哈希的静态资源交给 nginx 直接发，减轻 Node 压力
	# location /assets/ {
	#     proxy_pass http://piwebui_relay;
	#     proxy_cache_valid 200 30d;
	#     add_header Cache-Control "public, max-age=31536000, immutable";
	# }
}
